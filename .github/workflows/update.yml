name: Update results and deploy

on:
  schedule:
    - cron: '17 10 * * *'  # daily, about 6am US Eastern
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # pushes only redeploy; the schedule and manual runs also re-crawl
      - name: Crawl DSCO
        if: github.event_name != 'push'
        run: python dsco_crawl.py

      - name: Update ratings
        if: github.event_name != 'push'
        run: |
          pip install --quiet numpy
          python ratings.py

      - name: Commit new results
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data
          if ! git diff --cached --quiet; then
            git commit -m "Update results $(date -u +%F)"
            git push
          fi

      # site/index.html is written without a document wrapper so it can also be
      # published as a claude.ai page; add the doctype for GitHub Pages
      - name: Build site
        run: |
          mkdir _site
          cp -r site/data _site/
          { echo '<!doctype html>'; echo '<html lang="en">'; cat site/index.html; echo '</html>'; } > _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
